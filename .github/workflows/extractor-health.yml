name: YouTube compatibility

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'extractor/**'
      - 'app/src/main/java/org/schabi/newpipe/player/**'
      - 'app/src/main/java/org/schabi/newpipe/util/ExtractorHelper.java'
      - 'app/src/androidTest/java/org/schabi/newpipe/compatibility/**'
      - '.github/workflows/extractor-health.yml'

permissions:
  contents: read

concurrency:
  group: youtube-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback:
    # Only trusted dev runs may use a maintainer-configured Android runner.
    # Pull requests always execute on GitHub-hosted runners.
    runs-on: ${{ (github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && vars.NEWPIPET_PLAYBACK_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise extraction and decoded video/audio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.schabi.newpipe.compatibility.YouTubePlaybackTest -Pandroid.testInstrumentationRunnerArguments.youtubeLiveTests=true --stacktrace -DskipFormatKtlint
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: youtube-compatibility-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Explain failed probe
        if: failure()
        run: |
          echo 'The live probe failed. Check the report for extractor, network, video availability or decoder failures. No automatic release was made.' >> "$GITHUB_STEP_SUMMARY"
